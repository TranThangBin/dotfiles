[trantbox]
image="ghcr.io/tranthangbin/trantbox:latest"
start_now=true
entry=true
pre_init_hooks="export SHELL=/usr/bin/fish"
volume="trantbox_box-pacman_cache:/var/cache/pacman/pkg:rw"

[trantbox-desktop]
include=trantbox
home="$HOME/distrobox/trantbox-desktop"
nvidia=true
unshare_devsys=true
unshare_groups=true
unshare_ipc=true
unshare_netns=true
additional_flags="--env DBUS_SYSTEM_BUS_ADDRESS=unix:path=/run/host/var/run/dbus/system_bus_socket"
additional_flags="--network host"
volume="/dev/input:/dev/input:ro"
